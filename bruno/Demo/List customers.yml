info:
  name: List customers
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}/api/v1/lists/86C72C1BF64B6DF04825847100373215?dataSource=demo"
  headers:
    - name: Authorization
      value: Bearer {{BEARER}}
  params:
    - name: dataSource
      value: demo
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
