info:
  name: List ALL customers
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}/api/v1/lists/86C72C1BF64B6DF04825847100373215?dataSource=demo&count=7500"
  headers:
    - name: Authorization
      value: Bearer {{BEARER}}
  params:
    - name: dataSource
      value: demo
      type: query
    - name: count
      value: "7500"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body.length
      operator: eq
      value: "7500"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
