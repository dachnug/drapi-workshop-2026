info:
  name: Approval query
  type: http
  seq: 3

http:
  method: POST
  url: "{{HOST}}/api/v1/query?dataSource=approvals&action=execute"
  headers:
    - name: Authorization
      value: Bearer {{BEARER}}
  params:
    - name: dataSource
      value: approvals
      type: query
    - name: action
      value: execute
      type: query
  body:
    type: json
    data: |-
      { "forms" : ["equipment"],
        "query": "@All",
        "viewRefresh": true,
        "noViews": false
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
