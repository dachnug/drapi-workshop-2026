info:
  name: List approvals
  type: http
  seq: 1

http:
  method: GET
  url: "{{HOST}}/api/v1/lists/{{VIEWNAME}}?dataSource=approvals"
  headers:
    - name: Authorization
      value: Bearer {{BEARER}}
  params:
    - name: dataSource
      value: approvals
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
