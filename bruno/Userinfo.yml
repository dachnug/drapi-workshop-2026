info:
  name: Userinfo
  type: http
  seq: 4

http:
  method: GET
  url: "{{HOST}}/api/v1/userinfo"
  headers:
    - name: Authorization
      value: Bearer {{BEARER}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isJson
    - expression: res.body.names
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
