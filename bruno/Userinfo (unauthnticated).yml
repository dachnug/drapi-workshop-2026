info:
  name: Userinfo (unauthnticated)
  type: http
  seq: 3

http:
  method: GET
  url: "{{HOST}}/api/v1/userinfo"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body
      operator: isJson

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
